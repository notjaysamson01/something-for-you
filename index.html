    <main>

        <div class="intro-decoration">
            <span></span>
            <span>10</span>
            <span></span>
        </div>

        <h1 class="intro">
            Hi :)
            <br>
            <span>Before we start,</span>
            <br>
            I want you to answer a
            <br>
            very important question
            <br>

            <button class="survey-button">
                here
            </button>
        </h1>

        <div class="bottom-decoration">
            <span></span>
            <span>✦</span>
            <span></span>
        </div>

    </main>

    <div class="center-wrapper">

        <div class="message" id="secret-paragraph" data-text="It was the day of our Pangisdaan competition when I saw this one performer.

I don’t even know how to explain it... I just noticed her.

She was pretty. She was cute. And for some reason, she caught my attention more than anyone else that day. maybe it was her presence, or maybe I was just being stupidly amazed by a pretty girl I knew absolutely nothing about. it was that day, i told my friend 'gagi re parang na love at first sight ako'

The only problem was... she was from a different school.

I didn’t know her name. I didn’t know what grade she was in. I didn’t even know if I would ever see her again.

So I told myself, “Well... it would have been nice if I had the chance to talk to her.”

And I tried to forget about her.

Eventually, I started losing interest, and life went on. I got busy with school and everything else going on in my life. That random pretty girl from Pangisdaan was slowly becoming a 'too bad i didn't get the chance to talk to her'.

I didn’t think much about her anymore.

Or at least... I thought I didn’t.

Then, not too long after that, I started college.

I was just minding my own business when I saw a familiar face.

I looked at her and thought, “Wait... it surely cannot be her.”

There was no way.

After all, what were the chances that the girl I saw once during Pangisdaan would somehow end up in the same place as me?

So I brushed it off.

But then I got to know her.

We became friends.

And honestly, I was already happy with that. I never thought I would actually get the chance to talk to her, let alone become friends with her. I thought that was already more than enough.

Then one day, she saw my post where I was wearing the costume I wore during Pangisdaan.

She said,

“Sumayaw ka nung pangisdaan beh? sumayaw rin ako pangisdaan eh.”

...

And that was it.

Everything suddenly made sense.

It really was her.

The girl I thought I would never see again was... right there.

And somehow, the universe decided to bring the same girl back into my life when I least expected it.

Funny, right? :)

But then came the part I didn’t expect.

I realized that I still liked her.

Actually...

I don’t think I ever completely stopped.

I just didn’t know it yet.

I tried to hide it. I tried to ignore it. I told myself, “Maybe it’ll go away.”

hahaha... it didn’t...

Instead, it kept getting stronger.

And stronger.

And somehow, this girl who was once just a random performer I saw at Pangisdaan became someone I started looking forward to seeing. Someone I wanted to talk to. Someone I wanted to know more about.

Someone I started imagining being a part of my life.

And eventually, I had to admit it to myself...

I like her.

A lot.

I want to spend more time with her. I want to get to know her better. And if I were ever given the chance, I would want her to be my girlfriend.

But unfortunately... there’s a little problem.

She still likes her ex.

And she wants to get back together with him.

So now I’m stuck between two things.

One part of me wants to say, “Please choose me.”

But another part of me says, “If she’s happy, shouldn’t that be enough?”

And honestly... I don’t know.

I want her to be mine.

But I also want her to be happy.

Even if that happiness ends up being with someone else.

And if, somehow, that girl happens to stumble upon this website and read this whole thing...

Well...

Hi. :)

Yes.

I’m talking about you.

Everything I’ve been saying is about you.

The girl I’ve been telling you about is you.

All my jokes like 'sobrang ganda niya beh' and 'miss ko na siya beh' I was talking about you.

That’s why you can’t figure out who I like in our class.

You probably thought I was talking about someone else this whole time...

Surprise. :)

I know you still like your ex.

I know you want to get back together with him.

And I respect that.

I’m not asking you to forget about him.

I’m not asking you to force yourself to move on.

I’m not asking you to suddenly fall in love with me just because I admitted all of this.

And I’m definitely not asking you to choose me just because I like you.

All I’m asking for is a chance.

A chance to show you how I feel.

A chance to get to know you in a different way.

A chance to see if maybe... just maybe... there could be something between us.

I don’t know what will happen.

Maybe you’ll say no.

Maybe nothing will change between us.

Maybe you’ll still choose your ex.

And if that’s what makes you happy, then I’ll respect it.

Because liking someone isn’t just about wanting them to be yours.

Sometimes, it’s about wanting them to be happy, even when you don’t know if you’ll be the reason for that happiness.

But if there’s even a small part of you that wonders what it would be like...

If there’s even a small chance that you might want to give me a chance...

Then I’d be willing to take that chance with you.

No pressure.

No expectations.

Just me, being honest for once.

I liked you when I first saw you at Pangisdaan.

I liked you when I realized who you were.

And somehow, I like you even more now.

So...

If you’ve made it this far, I guess there’s only one thing left to say.

I like you.

I really, really do.

And maybe the funniest part about all of this is that the girl I thought I would never see again...

ended up becoming the girl I never wanted to lose. :)

beh susuntukin kita pag sinabi mong ai to, pinag puyatan ko to."></div>

    <div id="survey-modal" class="modal">

                </p>

                <label for="name">
                    What is your name?
                </label>

                <p class="question-description">
                    Just making sure it's you.
                </p>

                <div class="input-container">

                    <input
                        type="text"
                        id="name"
                        placeholder="Put name here..."
                        autocomplete="off"
                    >

                </div>

                <button class="submit-button">
                    submit
                    <span>→</span>
                </button>

            </div>

            <div class="modal-bottom">
                <span>PLEASE ANSWER HONESTLY</span>
            </div>

        </div>

    </div>
